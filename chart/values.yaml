# Required: Gateway API parameters shared by the service HTTPRoute and all
# Spark driver HTTPRoutes.
httpHostname: ""          # e.g. spark.example.com
httpGatewayName: ""       # e.g. main-gateway
httpGatewayNamespace: ""  # e.g. gateway-system
# Port of the Gateway listener. Must match the port set in the Gateway's
# listener (typically 443 for HTTPS). Set to 0 to omit the port field.
httpGatewayPort: 443

# Optional: Kubernetes Service name of the Spark History Server.
# When set, a managed HTTPRoute for "/" is created pointing to this service
# when it has at least one ready pod, and falls back to the dashboard when it
# does not. When not set, the static HTTPRoute also claims "/" for the dashboard.
shsService: ""

# Optional: Kubernetes Deployment name for the Spark History Server.
# When set (and shsService is set), the wake endpoint patches this Deployment
# to scale up from zero when a user clicks the "Start Spark History Server" link.
# Defaults to shsService when not set (i.e. the Service and Deployment share the
# same name, which is the common case).
# Set to "disabled" to disable wake/stop features even when shsService is set.
shsDeployment: ""

# UTC time (HH:MM) at which the SHS Deployment is automatically scaled to zero
# each day. Empty (default) or "disabled" disables the automatic stop.
# Only effective when shsDeployment (or shsService) is configured.
shsStopTime: "disabled"

# Container image.
image:
  repository: ghcr.io/unaiur/k8s-spark-ui-assist
  # Defaults to the chart appVersion when not set.
  tag: ""
  pullPolicy: IfNotPresent

# Number of replicas. The service is stateless and can be scaled up for
# high availability, but a single replica is sufficient for most use cases.
replicaCount: 1

# Resource requests and limits.
# See DESIGN.md for the memory footprint analysis.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

# Service configuration.
service:
  type: ClusterIP
  port: 80
  # targetPort must match the container port (8080).
  targetPort: 8080

# ServiceAccount configuration.
serviceAccount:
  # Name of the ServiceAccount to create. Defaults to the release fullname.
  name: ""
  # Additional annotations on the ServiceAccount (e.g. for IRSA / Workload Identity).
  annotations: {}

# Pod annotations.
podAnnotations: {}

# Pod security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532   # matches distroless nonroot

# Container security context.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Node selector, tolerations and affinity.
nodeSelector: {}
tolerations: []
affinity: {}

# Extra environment variables to set on the container.
extraEnv: []
